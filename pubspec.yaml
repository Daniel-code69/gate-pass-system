name: digital_gate_pass
description: Digital Gate Pass System for College
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0
  pdf: ^3.10.0
  printing: ^5.12.0
  share_plus: ^7.2.0
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  firebase_database: ^11.3.0
  google_sign_in: ^6.2.0
  mobile_scanner: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
